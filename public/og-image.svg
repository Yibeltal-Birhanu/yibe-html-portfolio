<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0a0a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="200" r="300" fill="#00d4ff" opacity="0.03"/>
  <circle cx="1000" cy="450" r="250" fill="#7c3aed" opacity="0.03"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Logo mark -->
  <rect x="80" y="220" width="64" height="64" rx="14" fill="url(#logo)"/>
  <text x="112" y="262" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="36" fill="white">Y</text>

  <!-- Name -->
  <text x="164" y="258" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="32" fill="white" letter-spacing="0.5">Yibeltal Birhanu</text>

  <!-- Tagline -->
  <text x="80" y="340" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="22" fill="#8888a0">Software Developer &amp; AI Builder</text>

  <!-- Description -->
  <text x="80" y="390" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16" fill="#5a5a72">Building practical software systems, intelligent applications,</text>
  <text x="80" y="415" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16" fill="#5a5a72">and digital products.</text>

  <!-- Tech pills -->
  <rect x="80" y="470" width="60" height="28" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.5"/>
  <text x="110" y="489" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="11" fill="#00d4ff">Python</text>

  <rect x="152" y="470" width="46" height="28" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.5"/>
  <text x="175" y="489" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="11" fill="#00d4ff">.NET</text>

  <rect x="210" y="470" width="62" height="28" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.5"/>
  <text x="241" y="489" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="11" fill="#00d4ff">Flutter</text>

  <rect x="284" y="470" width="50" height="28" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.5"/>
  <text x="309" y="489" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="11" fill="#00d4ff">AI/ML</text>

  <!-- Bottom bar -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)" opacity="0.15"/>
</svg>
